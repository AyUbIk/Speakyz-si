name = "speakyz-api"
main = "index.js"
compatibility_date = "2025-10-01"

# Run the Worker near Frankfurt so Google sees a supported region,
# no matter where the visitor is (Netlify did the same from the US).
[placement]
region = "aws:eu-central-1"

[vars]
# Origins of your site, comma-separated, no trailing slash.
# GitHub Pages: https://<username>.github.io  (path /Speakyz-site is NOT part of the origin)
ALLOWED_ORIGINS = "https://ayubik.github.io"
