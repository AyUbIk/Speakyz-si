<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>document.documentElement.classList.add("js")</script>
<title>Speakyz — Speak English out loud. IELTS &amp; speaking courses in Tashkent</title>
<meta name="description" content="Speaking clubs, IELTS preparation and individual English lessons in Tashkent and online. Start with a free first lesson.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--h:48px;--k:#000;--w:#F5F5F7;--ink:#1D1D1F;--m:#86868B;--bl:#2A3CFF;--y:#FFD60A;--c:#FF4B2B;--ln:rgba(255,255,255,.16);--d:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--b:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--k);color:#fff;font:400 1.0625rem/1.5 var(--b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:10}
a{color:inherit}:focus-visible{outline:3px solid var(--y);outline-offset:3px;border-radius:8px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;height:var(--h);background:rgba(0,0,0,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
header .in{max-width:1080px;margin:0 auto;padding:0 16px;height:100%;display:flex;align-items:center;gap:8px}
.logo{font:800 1.25rem/1 var(--d);text-decoration:none;letter-spacing:-.03em;margin-right:6px}
nav{display:flex;flex:1;gap:2px;overflow-x:auto;scrollbar-width:none}
nav a{text-decoration:none;font-size:.9rem;color:rgba(255,255,255,.72);padding:6px 12px;border-radius:99px;white-space:nowrap}
nav a:hover{color:#fff}nav a[aria-current="page"]{color:#000;background:#fff}
.btn{display:inline-block;background:var(--bl);color:#fff;font:700 1rem/1 var(--b);padding:16px 28px;border-radius:99px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s}
.btn:hover{transform:scale(1.04)}.btn.y{background:var(--y);color:#000}.btn.g{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
header .btn{padding:8px 16px;font-size:.88rem;white-space:nowrap}
.hbtn{width:40px;height:40px;border:0;background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer;margin-right:2px;padding:0}
.hbtn span{display:block;width:20px;height:2px;background:#fff;border-radius:2px;transition:transform .25s,opacity .25s}
.hbtn[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hbtn[aria-expanded="true"] span:nth-child(2){opacity:0}
.hbtn[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:7;opacity:0;pointer-events:none;transition:opacity .25s}
.menu-backdrop.on{opacity:1;pointer-events:auto}
.menu-panel{position:fixed;top:0;left:0;bottom:0;width:min(300px,82vw);background:#0b0b0d;border-right:1px solid rgba(255,255,255,.08);z-index:8;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 24px;display:flex;flex-direction:column;gap:2px;transform:translateX(-100%);transition:transform .3s ease;overflow-y:auto}
.menu-panel.on{transform:translateX(0)}
